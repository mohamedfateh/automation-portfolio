<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="t d">
<title id="t">Chocolate distribution automation architecture</title>
<desc id="d">Five chocolate supply tanks feeding multiple production users through route selection, pump and valve interlocks, and a shared distribution manifold.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071019"/>
    <stop offset="1" stop-color="#102837"/>
  </linearGradient>
  <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#17384a"/>
    <stop offset="1" stop-color="#0b1d28"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="650" rx="28" fill="url(#bg)"/>
<path d="M0 520 H1200" stroke="#173748" stroke-width="1"/>
<path d="M0 106 H1200" stroke="#173748" stroke-width="1"/>

<text x="60" y="54" fill="#8ca6b7" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="4">CHOCOLATE DISTRIBUTION AUTOMATION</text>
<text x="60" y="86" fill="#f3f7fa" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Multi-source routing · Interlocks · Operator control</text>

<!-- source tanks -->
<g font-family="Arial,Helvetica,sans-serif">
  <text x="60" y="138" fill="#38a7ce" font-size="15" font-weight="700" letter-spacing="2">SOURCE TANKS</text>
  <g transform="translate(80 160)">
    <g transform="translate(0 0)"><rect width="150" height="125" rx="28" fill="url(#tank)" stroke="#31566c"/><path d="M22 76 H128 V103 Q128 115 116 115 H34 Q22 115 22 103Z" fill="#6b3e2e" opacity=".65"/><text x="75" y="35" text-anchor="middle" fill="#f3f7fa" font-size="16" font-weight="700">TANK 1</text><circle cx="75" cy="126" r="8" fill="#32c48d"/></g>
    <g transform="translate(180 0)"><rect width="150" height="125" rx="28" fill="url(#tank)" stroke="#31566c"/><path d="M22 68 H128 V103 Q128 115 116 115 H34 Q22 115 22 103Z" fill="#6b3e2e" opacity=".65"/><text x="75" y="35" text-anchor="middle" fill="#f3f7fa" font-size="16" font-weight="700">TANK 2</text><circle cx="75" cy="126" r="8" fill="#32c48d"/></g>
    <g transform="translate(360 0)"><rect width="150" height="125" rx="28" fill="url(#tank)" stroke="#31566c"/><path d="M22 82 H128 V103 Q128 115 116 115 H34 Q22 115 22 103Z" fill="#6b3e2e" opacity=".65"/><text x="75" y="35" text-anchor="middle" fill="#f3f7fa" font-size="16" font-weight="700">TANK 3</text><circle cx="75" cy="126" r="8" fill="#32c48d"/></g>
    <g transform="translate(540 0)"><rect width="150" height="125" rx="28" fill="url(#tank)" stroke="#31566c"/><path d="M22 72 H128 V103 Q128 115 116 115 H34 Q22 115 22 103Z" fill="#6b3e2e" opacity=".65"/><text x="75" y="35" text-anchor="middle" fill="#f3f7fa" font-size="16" font-weight="700">TANK 4</text><circle cx="75" cy="126" r="8" fill="#32c48d"/></g>
    <g transform="translate(720 0)"><rect width="150" height="125" rx="28" fill="url(#tank)" stroke="#31566c"/><path d="M22 64 H128 V103 Q128 115 116 115 H34 Q22 115 22 103Z" fill="#6b3e2e" opacity=".65"/><text x="75" y="35" text-anchor="middle" fill="#f3f7fa" font-size="16" font-weight="700">TANK 5</text><circle cx="75" cy="126" r="8" fill="#32c48d"/></g>
  </g>

  <!-- vertical feed lines -->
  <g stroke="#6f8b9c" stroke-width="5" fill="none">
    <path d="M155 294 V355"/><path d="M335 294 V355"/><path d="M515 294 V355"/><path d="M695 294 V355"/><path d="M875 294 V355"/>
  </g>
  <g fill="#38a7ce">
    <circle cx="155" cy="327" r="9"/><circle cx="335" cy="327" r="9"/><circle cx="515" cy="327" r="9"/><circle cx="695" cy="327" r="9"/><circle cx="875" cy="327" r="9"/>
  </g>

  <!-- central manifold -->
  <path d="M110 355 H930" stroke="#38a7ce" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <text x="520" y="386" text-anchor="middle" fill="#8ca6b7" font-size="14" letter-spacing="2">SHARED DISTRIBUTION MANIFOLD</text>

  <!-- route controller -->
  <rect x="950" y="150" width="200" height="238" rx="20" fill="#0a1822" stroke="#27516a"/>
  <text x="1050" y="185" text-anchor="middle" fill="#38a7ce" font-size="14" font-weight="700" letter-spacing="2">ROUTE LOGIC</text>
  <g fill="#dfe9ef" font-size="14">
    <text x="982" y="225">● Source availability</text>
    <text x="982" y="258">● Destination request</text>
    <text x="982" y="291">● Route conflict check</text>
    <text x="982" y="324">● Pump / valve permissives</text>
    <text x="982" y="357">● Operator status feedback</text>
  </g>
  <path d="M930 355 H950" stroke="#32c48d" stroke-width="5"/>

  <!-- destinations -->
  <text x="60" y="430" fill="#32c48d" font-size="15" font-weight="700" letter-spacing="2">PRODUCTION USERS</text>
  <g>
    <path d="M155 355 V456 M335 355 V456 M515 355 V456 M695 355 V456 M875 355 V456" stroke="#6f8b9c" stroke-width="5"/>
    <g fill="#0b1d28" stroke="#31566c">
      <rect x="80" y="456" width="150" height="92" rx="14"/>
      <rect x="260" y="456" width="150" height="92" rx="14"/>
      <rect x="440" y="456" width="150" height="92" rx="14"/>
      <rect x="620" y="456" width="150" height="92" rx="14"/>
      <rect x="800" y="456" width="150" height="92" rx="14"/>
    </g>
    <g fill="#f3f7fa" font-size="16" font-weight="700" text-anchor="middle">
      <text x="155" y="493">PROCESS 1</text><text x="335" y="493">PROCESS 2</text><text x="515" y="493">PROCESS 3</text><text x="695" y="493">PROCESS 4</text><text x="875" y="493">PROCESS 5</text>
    </g>
    <g fill="#8ca6b7" font-size="12" text-anchor="middle">
      <text x="155" y="520">Route ready / active</text><text x="335" y="520">Route ready / active</text><text x="515" y="520">Route ready / active</text><text x="695" y="520">Route ready / active</text><text x="875" y="520">Route ready / active</text>
    </g>
  </g>

  <g transform="translate(80 590)">
    <rect width="1040" height="34" rx="17" fill="#0a1822" stroke="#173748"/>
    <text x="520" y="22" text-anchor="middle" fill="#8ca6b7" font-size="13" letter-spacing="1.2">PHYSICAL PIPING LAYOUT → ROUTE MODEL → INTERLOCKED CONTROL → OPERATOR FEEDBACK</text>
  </g>
</g>
</svg>